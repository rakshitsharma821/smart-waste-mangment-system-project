<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warden Dashboard</title>
  
  <!-- 👇 Use warden.css instead of style.css -->
  <link rel="stylesheet" href="warden.css">
  
  <!-- 👇 Connect warden.js -->
  <script src="warden.js" defer></script>
</head>
<body>
  <script>
    // 🔒 Prevent unauthorized access
    if (localStorage.getItem("wardenLoggedIn") !== "true") {
      alert("Please login first!");
      window.location.href = "warden-login.html";
    }
  </script>

  <header>
    <h1>🏫 Warden Management Panel</h1>
    <p>View and manage waste collection requests</p>
    <button onclick="logout()" style="margin-top:10px;">🚪 Logout</button>
  </header>

  <div class="container">
    <h2>Pending Waste Reports</h2>

    <table id="wardenTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Location</th>
          <th>Type</th>
          <th>Description</th>
          <th>Photo</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p style="margin-top:20px;">⬅️ <a href="index.html">Back to User Portal</a></p>
  </div>
</body>
</html>
