<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warden Login - Waste Management</title>
    <link rel="stylesheet" href="warden-login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="side-animation">
            <div class="animation-overlay">
                <h2>Waste Management System</h2>
                <p>Efficient waste collection management</p>
            </div>
        </div>
        <div class="login-form-container">
            <div class="login-box">
                <div class="login-header">
                    <h1>🏫 Warden Login</h1>
                    <p>Access your management panel</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required placeholder="Enter username" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter password" autocomplete="current-password">
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                    <div id="errorMessage" class="error-message"></div>
                </form>
                <div class="login-footer">
                    <p>Don't have an account? <a href="warden-signup.html" class="signup-link" style="color: #1976d2; text-decoration: none; font-weight: 600;">Sign Up</a></p>
                    <a href="index.html?role=warden" class="back-link">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    <script src="warden.js"></script>
</body>
</html>
