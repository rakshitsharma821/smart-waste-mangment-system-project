<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Signup - Waste Management</title>
    <link rel="stylesheet" href="user.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="user-signup-page">
    <div class="container">
        <header>
            <h1>♻ Waste Management Portal</h1>
            <p>Create Your Account</p>
        </header>

        <div class="form-container">
            <div class="login-box-user">
                <div class="login-header-user">
                    <h2>👤 Student Signup</h2>
                    <p>Create a new account</p>
                </div>
                <form id="userSignupForm">
                    <div class="form-group">
                        <label for="userFullName">Full Name *</label>
                        <input type="text" id="userFullName" name="fullName" required placeholder="Enter your full name" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="userUsername">Username *</label>
                        <input type="text" id="userUsername" name="username" required placeholder="Choose a username" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="userEmail">Email *</label>
                        <input type="email" id="userEmail" name="email" required placeholder="Enter your email" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="userPassword">Password *</label>
                        <input type="password" id="userPassword" name="password" required placeholder="Create a password" autocomplete="new-password" minlength="4">
                        <small>Minimum 4 characters</small>
                    </div>
                    <div class="form-group">
                        <label for="userConfirmPassword">Confirm Password *</label>
                        <input type="password" id="userConfirmPassword" name="confirmPassword" required placeholder="Confirm your password" autocomplete="new-password">
                    </div>
                    <button type="submit" class="submit-btn">Sign Up</button>
                    <div id="userErrorMessage" class="error-message-user"></div>
                </form>
                <div class="login-footer-user">
                    <p>Already have an account? <a href="user-login.html" class="signup-link-user">Login here</a></p>
                    <a href="index.html?role=user" class="back-link-user">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    <script src="user.js"></script>
</body>
</html>
