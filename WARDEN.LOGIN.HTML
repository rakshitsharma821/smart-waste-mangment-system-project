<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warden Login / Sign Up</title>
  <link rel="stylesheet" href="WARDEN.LOGIN.css">
</head>
<body>
  <div class="login-container">
    <h2 id="formTitle">🏫 Warden Login
        <link rel="stylesheet" href="WARDEN.LOGIN.CSS">
<script src="warden.js" defer></script>

    </h2>

    <!-- Login Form -->
    <form id="wardenLoginForm">
      <label for="loginUsername">Username:</label>
      <input type="text" id="loginUsername" placeholder="Enter username" required>

      <label for="loginPassword">Password:</label>
      <input type="password" id="loginPassword" placeholder="Enter password" required>

      <button type="submit">Login</button>
      <p id="errorMsg" class="error"></p>

      <p>Don’t have an account? <a href="#" id="showSignup">Sign Up</a></p>
    </form>

    <!-- Signup Form -->
    <form id="wardenSignupForm" style="display:none;">
      <label for="signupUsername">Create Username:</label>
      <input type="text" id="signupUsername" placeholder="Choose username" required>

      <label for="signupPassword">Create Password:</label>
      <input type="password" id="signupPassword" placeholder="Choose password" required>

      <button type="submit">Sign Up</button>
      <p id="signupMsg" class="error"></p>

      <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
    </form>
  </div>

  <script>
    // 🌿 Switch between Login and Signup
    const loginForm = document.getElementById("wardenLoginForm");
    const signupForm = document.getElementById("wardenSignupForm");
    const formTitle = document.getElementById("formTitle");

    document.getElementById("showSignup").addEventListener("click", () => {
      loginForm.style.display = "none";
      signupForm.style.display = "block";
      formTitle.textContent = "🆕 Warden Sign Up";
    });

    document.getElementById("showLogin").addEventListener("click", () => {
      signupForm.style.display = "none";
      loginForm.style.display = "block";
      formTitle.textContent = "🏫 Warden Login";
    });

    // ✅ Sign Up Logic (save to localStorage)
    signupForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("signupUsername").value.trim();
      const pass = document.getElementById("signupPassword").value.trim();
      const signupMsg = document.getElementById("signupMsg");

      if (user === "" || pass === "") {
        signupMsg.textContent = "All fields required!";
        return;
      }

      let wardens = JSON.parse(localStorage.getItem("wardens")) || [];

      // Check if username already exists
      if (wardens.some(w => w.username === user)) {
        signupMsg.textContent = "Username already taken!";
        return;
      }

      wardens.push({ username: user, password: pass });
      localStorage.setItem("wardens", JSON.stringify(wardens));

      signupMsg.style.color = "green";
      signupMsg.textContent = "Signup successful! Please login.";
      setTimeout(() => {
        document.getElementById("showLogin").click();
      }, 1500);
    });

    // 🔑 Login Logic (check from localStorage)
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const user = document.getElementById("loginUsername").value.trim();
      const pass = document.getElementById("loginPassword").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      const wardens = JSON.parse(localStorage.getItem("wardens")) || [];
      const validUser = wardens.find(w => w.username === user && w.password === pass);

      if (validUser) {
        localStorage.setItem("wardenLoggedIn", "true");
        window.location.href = "warden.html";
      } else {
        errorMsg.textContent = "Invalid username or password!";
      }
    });
  </script>
</body>
</html>
