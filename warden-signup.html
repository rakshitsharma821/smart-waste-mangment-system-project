<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warden Signup - Waste Management</title>
    <link rel="stylesheet" href="warden-login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="warden-signup-page">
    <div class="login-container">
        <div class="side-animation">
            <div class="animation-overlay">
                <h2>Waste Management System</h2>
                <p>Create your warden account</p>
            </div>
        </div>
        <div class="login-form-container">
            <div class="login-box">
                <div class="login-header">
                    <h1>🏫 Warden Signup</h1>
                    <p>Create a new account</p>
                </div>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" name="username" required placeholder="Choose a username" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required placeholder="Create a password" autocomplete="new-password" minlength="4">
                        <small>Minimum 4 characters</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="authCode">Authorization Code *</label>
                        <input type="text" id="authCode" name="authCode" required placeholder="Enter authorization code" autocomplete="off">
                        <small style="color: #666; font-style: italic;">Only authorized personnel can create warden accounts. Get code from administrator.</small>
                    </div>
                    <button type="submit" class="login-btn">Sign Up</button>
                    <div id="errorMessage" class="error-message"></div>
                </form>
                <div class="login-footer">
                    <p>Need an authorization code? <a href="auth-code-generator.html" class="signup-link" style="color: #1976d2; text-decoration: none; font-weight: 600;">Generate Code</a></p>
                    <p style="margin-top: 10px;">Already have an account? <a href="warden-login.html" class="signup-link" style="color: #1976d2; text-decoration: none; font-weight: 600;">Login here</a></p>
                    <a href="index.html?role=warden" class="back-link">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    <script src="warden.js"></script>
</body>
</html>
